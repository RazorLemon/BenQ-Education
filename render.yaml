services:
  - type: web
    name: benq-classroom-api
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npm run prisma:generate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SCHOOL_SETUP_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false

  - type: web
    name: benq-classroom-frontend
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
